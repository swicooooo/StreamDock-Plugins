<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SimHub Control Mapper</title>
  <style>
    body { background:#2d2d2d; color:#eee; font:14px sans-serif; padding:12px; }
    label { display:block; margin-bottom:8px; color:#ccc; }
    select { width:100%; padding:8px; color:#eee; background:#3d3d3d; border:1px solid #666; border-radius:4px; }
    .status { margin-top:12px; color:#aaa; line-height:1.5; }
    .error { color:#ff6b6b; }
  </style>
</head>
<body>
  <label id="role-label" for="role">SimHub Control Mapper Role</label>
  <select id="role"><option value="">Connecting to SimHub…</option></select>
  <div id="status" class="status">Make sure SimHub is running and Control Mapper is enabled.</div>
  <script>
    let websocket;
    let context;
    let currentRole = '';
    let strings = {};
    const languageFiles = { en:'en', zh_CN:'zh_CN', ja:'ja', ko:'ko', fr:'fr', de:'de', es:'es', ru:'ru', pt:'pt', pt_BR:'pt' };
    const text = (key, fallback) => strings[key] || fallback;

    async function localize(infoJson) {
      let language = 'en';
      try { language = JSON.parse(infoJson).application?.language || 'en'; } catch (_) {}
      const normalized = language.replace('-', '_');
      const file = languageFiles[normalized] || languageFiles[normalized.split('_')[0]] || 'en';
      try { strings = (await (await fetch(`../../${file}.json`)).json()).Localization || {}; } catch (_) {}
      document.documentElement.lang = normalized;
      document.querySelector('#role-label').textContent = text('Control Mapper role', 'SimHub Control Mapper Role');
      document.querySelector('#role').innerHTML = `<option value="">${text('Connecting', 'Connecting to SimHub…')}</option>`;
      document.querySelector('#status').textContent = text('Connection hint', 'Make sure SimHub is running and Control Mapper is enabled.');
    }

    function save() {
      if (!websocket || websocket.readyState !== WebSocket.OPEN) return;
      currentRole = document.querySelector('#role').value;
      websocket.send(JSON.stringify({
        event: 'setSettings', context,
        payload: { rolename: currentRole }
      }));
    }

    async function loadRoles() {
      const select = document.querySelector('#role');
      const status = document.querySelector('#status');
      try {
        const response = await fetch('http://127.0.0.1:8888/api/ControlMapper/GetRoles');
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const roles = await response.json();
        select.innerHTML = `<option value="">${text('Choose role', 'Choose a role')}</option>`;
        roles.forEach(role => {
          const option = document.createElement('option');
          option.value = role;
          option.textContent = role;
          select.appendChild(option);
        });
        if (currentRole && !roles.includes(currentRole)) {
          const option = document.createElement('option');
          option.value = currentRole;
          option.textContent = currentRole;
          select.appendChild(option);
        }
        select.value = currentRole;
        status.textContent = text('Connected', 'Connected to SimHub. {count} roles available.').replace('{count}', roles.length);
        status.classList.remove('error');
      } catch (error) {
        select.innerHTML = `<option value="">${text('Connection failed', 'Connection failed: {error}').replace(': {error}', '')}</option>`;
        status.textContent = text('Connection failed', 'Connection failed: {error}').replace('{error}', error.message);
        status.classList.add('error');
      }
    }

    function connectElgatoStreamDeckSocket(port, uuid, registerEvent, info, actionInfoJson) {
      context = uuid;
      const actionInfo = JSON.parse(actionInfoJson);
      currentRole = actionInfo.payload?.settings?.rolename || '';
      websocket = new WebSocket(`ws://127.0.0.1:${port}`);
      websocket.onopen = async () => {
        websocket.send(JSON.stringify({ event: registerEvent, uuid }));
        await localize(info);
        loadRoles();
      };
      websocket.onmessage = event => {
        const message = JSON.parse(event.data);
        if (message.event === 'didReceiveSettings') {
          currentRole = message.payload?.settings?.rolename || currentRole;
          document.querySelector('#role').value = currentRole;
        }
      };
    }
    document.querySelector('#role').addEventListener('change', save);
  </script>
</body>
</html>
