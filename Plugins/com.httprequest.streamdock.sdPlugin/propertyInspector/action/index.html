<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>HTTP Request - Settings</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #2d2d2d;
      color: #d8d8d8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
    }
    .sdpi-wrapper { padding: 12px; display: none; }
    .sdpi-heading {
      font-weight: 600;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #999;
      margin-bottom: 10px;
    }
    .sdpi-item {
      display: flex;
      align-items: center;
      min-height: 32px;
      margin-bottom: 8px;
    }
    .sdpi-item label {
      width: 90px;
      flex-shrink: 0;
      color: #aaa;
      font-size: 12px;
    }
    .sdpi-item input[type="text"],
    .sdpi-item input[type="number"],
    .sdpi-item select,
    .sdpi-item textarea {
      flex: 1;
      background: #3d3d3d;
      border: 1px solid #555;
      border-radius: 3px;
      color: #d8d8d8;
      padding: 4px 8px;
      font-size: 12px;
      outline: none;
    }
    .sdpi-item input:focus,
    .sdpi-item select:focus,
    .sdpi-item textarea:focus {
      border-color: #0099ff;
    }
    .sdpi-item textarea {
      resize: vertical;
      min-height: 60px;
      font-family: monospace;
      font-size: 11px;
    }
    .sdpi-item select {
      height: 26px;
    }
    .sdpi-item input[type="checkbox"] {
      width: 16px; height: 16px;
      accent-color: #0099ff;
    }
    .hint {
      font-size: 10px;
      color: #777;
      margin-left: 90px;
      margin-bottom: 8px;
      line-height: 1.4;
    }
    hr { border: none; border-top: 1px solid #444; margin: 10px 0; }
  </style>
</head>
<body>
<div class="sdpi-wrapper">
  <div class="sdpi-heading">HTTP Request</div>

  <div class="sdpi-item">
    <label for="url">URL</label>
    <input type="text" id="url" placeholder="http://192.168.1.100/api/action" />
  </div>

  <div class="sdpi-item">
    <label for="method">Method</label>
    <select id="method">
      <option value="GET">GET</option>
      <option value="POST">POST</option>
      <option value="PUT">PUT</option>
      <option value="DELETE">DELETE</option>
      <option value="PATCH">PATCH</option>
    </select>
  </div>

  <hr />

  <div class="sdpi-item">
    <label for="headers">Headers</label>
    <textarea id="headers" placeholder='{"Authorization": "Bearer token"}'></textarea>
  </div>
  <div class="hint">Optional JSON object of request headers.</div>

  <div class="sdpi-item">
    <label for="body">Body</label>
    <textarea id="body" placeholder='{"key": "value"}'></textarea>
  </div>
  <div class="hint">Optional request body (POST/PUT/PATCH). JSON by default.</div>

  <hr />

  <div class="sdpi-item">
    <label for="timeout">Timeout (ms)</label>
    <input type="number" id="timeout" min="500" max="60000" step="500" placeholder="10000" />
  </div>

  <div class="sdpi-item">
    <label for="showStatus">Show Status</label>
    <input type="checkbox" id="showStatus" />
  </div>
  <div class="hint">Show HTTP status code on the button after request.</div>
</div>

<script src="../utils/common.js"></script>
<script src="../utils/action.js"></script>
<script src="index.js"></script>
</body>
</html>
